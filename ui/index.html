<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Orca Kanban</title>
		<style>
			:root {
				--bg: #0d0d0f;
				--panel: #16161a;
				--panel-2: #1c1c21;
				--border: #2a2a31;
				--text: #e6e6ea;
				--muted: #8b8b96;
				--accent: #4493f8;
				--ok: #3fb950;
				--warn: #d29922;
				/* Distinct from --warn (a card the board is holding) and --accent (selection):
				   this one means a person has the keys. */
				--mine: #a371f7;
				--bad: #f85149;
				--radius: 8px;
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font: 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
			}
			header {
				display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
				padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel);
				position: sticky; top: 0; z-index: 10;
			}
			h1 { font-size: 14px; margin: 0 12px 0 0; font-weight: 600; letter-spacing: .2px; }
			button {
				background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
				border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
			}
			button:hover { border-color: #3a3a44; }
			button.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }
			button.danger { color: var(--bad); }
			button.ok { color: var(--ok); }
			button:disabled { opacity: .45; cursor: not-allowed; }
			.trail div { border-bottom: 1px solid var(--border); padding: 5px 0; font-size: 11px; }
			.trail .k { font-weight: 600; }
			.trail .k.rejected { color: var(--bad); }
			.trail .k.approved { color: var(--ok); }
			details summary { cursor: pointer; color: var(--muted); font-size: 11px; margin: 8px 0 4px; }
			.status { margin-left: auto; display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 12px; }
			.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
			.board { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: 10px; padding: 12px; align-items: start; }
			.col { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); min-height: 120px; }
			.col > h2 {
				font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
				margin: 0; padding: 9px 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
			}
			.col.over { outline: 1px solid var(--accent); }
			.cards { padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
			.card {
				background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
				padding: 8px; cursor: grab;
			}
			.card:hover { border-color: #3a3a44; }
			.card.sel { border-color: var(--accent); }
			/* A card the board has stopped watching. The left bar is deliberately loud: it is
			   the one state where nothing progresses unless you come back to it. */
			.card.mine { border-left: 3px solid var(--mine); background: #1d1b26; }
			.card.mine.sel { border-color: var(--mine); border-left-width: 3px; }
			.card .t { font-weight: 600; margin-bottom: 4px; word-break: break-word; }
			.meta { display: flex; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 11px; }
			.tag { background: #22222a; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
			.tag.mine { color: var(--mine); border-color: #3d2f56; }
			.tag.p { color: var(--accent); }
			.tag.err { color: var(--bad); }
			/* The panel is a form, so it gets a form's shape: a fixed identity strip at the
			   top, one scrolling body, and one action bar pinned at the bottom. The Save
			   button must never scroll out of reach. */
			aside {
				position: fixed; top: 0; right: 0; width: min(440px, 100vw); height: 100vh;
				background: var(--panel); border-left: 1px solid var(--border); z-index: 20;
				display: flex; flex-direction: column;
			}
			aside.hidden { display: none; }
			.p-head { padding: 11px 14px; border-bottom: 1px solid var(--border); }
			.p-head h2 { font-size: 13px; margin: 0 22px 4px 0; line-height: 1.35; word-break: break-word; }
			.p-body { flex: 1; overflow: auto; padding: 0 14px 16px; }
			.p-foot {
				border-top: 1px solid var(--border); background: var(--panel-2);
				padding: 9px 14px; display: flex; gap: 9px; align-items: center;
			}
			.p-foot .msg { font-size: 11px; color: var(--muted); }
			.p-foot .msg.ok { color: var(--ok); }
			.p-foot .msg.bad { color: var(--bad); }

			/* Sections keep the pane short: only what the card's state calls for is open. */
			details.group { border-bottom: 1px solid var(--border); }
			details.group > summary {
				cursor: pointer; padding: 9px 0; margin: 0; font-size: 11px; font-weight: 600;
				text-transform: uppercase; letter-spacing: .6px; color: var(--muted); list-style: none;
				display: flex; align-items: center; gap: 6px;
			}
			details.group > summary::-webkit-details-marker { display: none; }
			details.group > summary::before { content: '▸'; font-size: 9px; transition: transform .15s; }
			details.group[open] > summary::before { transform: rotate(90deg); }
			details.group > summary:hover { color: var(--text); }
			details.group > summary .n { margin-left: auto; font-weight: 400; letter-spacing: 0; text-transform: none; }
			details.group.mine > summary { color: var(--mine); }
			details.group.mine > summary .n { color: var(--mine); }
			.group-body { padding: 0 0 12px; }

			label { display: block; font-size: 11px; color: var(--muted); margin: 8px 0 3px; }
			input, textarea, select {
				width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
				border-radius: 5px; padding: 6px; font: inherit;
			}
			input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
			textarea { min-height: 62px; resize: vertical; }
			/* Fixed columns wrap into a grid instead of squeezing three number fields into
			   a 400px pane, which is what made this unreadable. */
			.grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); }
			.row { display: flex; gap: 8px; }
			.row > * { flex: 1; }
			.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
			.actions button { flex: 0 1 auto; }
			pre {
				background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 8px;
				white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; font-size: 11px; color: var(--muted);
			}
			.runs { font-size: 11px; }
			.runs div { border-bottom: 1px solid var(--border); padding: 5px 0; }
			.hint { color: var(--muted); font-size: 11px; margin-top: 6px; }
			.hint.warn { color: var(--warn); }
			/* What the agent wrote, treated as prose rather than machine output: body font,
			   generous line-height, real bullets, and a tall cap so a summary is readable in
			   place instead of through a 220px monospace slot. */
			.prose {
				background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
				padding: 9px 11px; font-size: 12px; line-height: 1.55; color: var(--text);
				max-height: 340px; overflow: auto; overflow-wrap: break-word;
			}
			.prose.bad { color: var(--bad); }
			.prose p { margin: 0 0 8px; }
			.prose p:last-child, .prose ul:last-child { margin-bottom: 0; }
			.prose ul { margin: 0 0 8px; padding-left: 17px; }
			.prose li { margin: 0 0 3px; }
			.prose code {
				background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px;
				padding: 0 3px; font-size: 11px; font-family: ui-monospace, SFMono-Regular, monospace;
			}
			.close { position: absolute; top: 9px; right: 10px; }
			kbd {
				background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px;
				padding: 0 4px; font: inherit; font-size: 10px;
			}
		</style>
	</head>
	<body>
		<header>
			<h1>Orca Kanban</h1>
			<button class="primary" id="autorun">Start auto-run</button>
			<button id="after">Stop after current</button>
			<button id="stopcur" class="danger">Stop current card</button>
			<button id="once">Run one card</button>
			<button id="recover">Recover</button>
			<button id="new">+ Card</button>
			<div class="status">
				<span id="sstate"><span class="dot"></span>—</span>
				<span id="scur"></span>
				<span id="scount"></span>
			</div>
		</header>

		<div class="board" id="board"></div>

		<aside id="panel" class="hidden">
			<button class="close" onclick="closePanel()" title="Close (Esc)">close</button>
			<div class="p-head" id="panelHead"></div>
			<div class="p-body" id="panelBody"></div>
			<div class="p-foot">
				<button class="primary" id="saveBtn" onclick="saveCard()">Save changes</button>
				<button id="revertBtn" onclick="revertCard()">Revert</button>
				<span class="msg" id="saveMsg"></span>
			</div>
		</aside>
		<script>
			const STATES = ['Backlog', 'Ready', 'In Progress', 'Review', 'Done', 'Blocked'];
			let snapshot = { cards: [], scheduler: {}, config: {}, eligible: [] };
			let selectedId = null;
			let dragId = null;

			const api = async (url, method = 'GET', body) => {
				const res = await fetch(url, {
					method,
					headers: body ? { 'content-type': 'application/json' } : undefined,
					body: body ? JSON.stringify(body) : undefined,
				});
				if (!res.ok) {
					const e = await res.json().catch(() => ({ error: res.statusText }));
					throw new Error(e.error || 'request failed');
				}
				return res.json();
			};

			const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

			/**
			 * Agent summaries are prose, not machine output: paragraphs, `-` bullets and
			 * backticked identifiers. Rendering them in the same monospace block used for file
			 * paths is what made them unreadable, so give them real text treatment.
			 *
			 * Deliberately tiny: escape everything first, then re-introduce only inline code,
			 * bullets and paragraph breaks. No HTML from an agent is ever trusted.
			 */
			function prose(text) {
				const BULLET = /^\s*[-*•]\s+/;
				const code = (s) => s.replace(/`([^`]+)`/g, '<code>$1</code>');
				const lines = esc(String(text ?? '').trim()).split('\n');

				const out = [];
				let paragraph = [];
				let bullets = [];

				const flushParagraph = () => {
					if (paragraph.length) out.push(`<p>${code(paragraph.join('<br>'))}</p>`);
					paragraph = [];
				};
				const flushBullets = () => {
					if (bullets.length) out.push(`<ul>${bullets.map((b) => `<li>${code(b)}</li>`).join('')}</ul>`);
					bullets = [];
				};

				for (const line of lines) {
					if (BULLET.test(line)) {
						// A lead-in line like "Changed:" ends the paragraph and starts the list,
						// which is the shape almost every agent summary actually uses.
						flushParagraph();
						bullets.push(line.replace(BULLET, ''));
					} else if (line.trim() === '') {
						flushBullets();
						flushParagraph();
					} else {
						flushBullets();
						paragraph.push(line);
					}
				}
				flushBullets();
				flushParagraph();
				return out.join('');
			}

			/** Compact "in 6d" for scheduled cards; mirrors formatRelative in src/text.ts. */
			const rel = (at) => {
				const d = at - Date.now();
				const abs = Math.abs(d);
				const [n, u] =
					abs >= 86400000 ? [Math.round(abs / 86400000), 'd']
					: abs >= 3600000 ? [Math.round(abs / 3600000), 'h']
					: abs >= 60000 ? [Math.round(abs / 60000), 'm']
					: [Math.round(abs / 1000), 's'];
				return d >= 0 ? `in ${n}${u}` : `${n}${u} ago`;
			};
			/**
			 * Enables or disables a control and says why. A button you can always press
			 * but that sometimes does nothing is worse than one that tells you the reason.
			 */
			function gate(id, allowed, whyNot) {
				const el = document.getElementById(id);
				if (!el) return;
				el.disabled = !allowed;
				el.title = allowed ? '' : whyNot;
			}

			// The panel re-renders on every poll, so a fetched diff is cached here or it
			// would vanish a second after you asked for it.
			let diffCache = { cardId: null, text: '' };

			function render() {
				const s = snapshot.scheduler || {};
				const running = s.runState === 'running';
				// A row can outlive its process, so `runState` alone would keep claiming the
				// board is watched after the daemon died. Say so instead of implying pickup.
				const dead = s.live && s.live.alive === false;
				const color = dead ? 'var(--bad)' : running ? 'var(--ok)' : s.autoRun ? 'var(--warn)' : 'var(--muted)';
				document.getElementById('sstate').innerHTML = dead
					? `<span class="dot" style="background:${color}"></span>not running`
					: `<span class="dot" style="background:${color}"></span>${esc(s.runState || '—')}${s.autoRun ? ' · auto' : ''}`;
				document.getElementById('sstate').title = dead ? `${s.live.reason} — start it with: kanban serve` : '';
				// A card you are holding progresses only when you come back to it, so the count
				// belongs in the header where you cannot miss having forgotten one.
				const held = (snapshot.cards || []).filter((c) => c.manualSince);
				document.getElementById('scount').innerHTML =
					`${s.cardsExecuted ?? 0} executed · ${s.inFlightCount ?? 0}/${s.maxConcurrent ?? 1} slots` +
					(held.length ? ` · <span style="color:var(--mine)" title="${esc(held.map((c) => c.id).join(', '))}">${held.length} yours</span>` : '');

				// Every lane, not just the first, so a multi-slot board is legible.
				const lanes = s.inFlight || [];
				document.getElementById('scur').textContent = lanes.length
					? lanes.map((f) => `${f.cardId}${f.sessionId ? ' · ' + f.sessionId.slice(0, 14) : ''}`).join('  |  ')
					: s.nextWakeAt
						? `next due ${rel(s.nextWakeAt)}`
						: '';

				// The button must say what it will DO, based on what the scheduler is
				// actually doing right now — a static label lies after the first click.
				const toggle = document.getElementById('autorun');
				toggle.textContent = s.autoRun ? 'Pause auto-run' : 'Start auto-run';
				toggle.className = s.autoRun ? '' : 'primary';
				toggle.title = s.autoRun
					? 'Auto-run is on: eligible cards are picked up automatically'
					: 'Auto-run is off: nothing runs until you start it';
				// Every control below is only meaningful in some states. Disable the rest
				// with a reason, rather than letting a click fail or quietly do nothing.
				const inFlightCount = s.inFlightCount ?? lanes.length;
				const slotsFree = (s.maxConcurrent ?? 1) - inFlightCount;
				const eligible = (snapshot.eligible || []).length;
				const stranded = snapshot.cards.filter((c) => c.state === 'In Progress').length;

				gate('after', s.autoRun && inFlightCount > 0, 'Only while auto-run is on with a card running');
				gate('stopcur', inFlightCount > 0, 'Nothing is running');
				gate(
					'once',
					slotsFree > 0 && eligible > 0,
					slotsFree <= 0 ? `All ${s.maxConcurrent} slots are busy` : 'No card is eligible right now',
				);
				gate('recover', stranded > 0, 'No card is stranded In Progress');

				const board = document.getElementById('board');
				board.innerHTML = '';
				for (const state of STATES) {
					// Review and Blocked are queues of work waiting on a human, so the one that has
					// waited longest belongs on top. Everywhere else, priority is what decides.
					const waiting = state === 'Review' || state === 'Blocked';
					const cards = snapshot.cards
						.filter((c) => c.state === state)
						.sort((a, b) =>
							waiting
								? a.stateChangedAt - b.stateChangedAt
								: b.priority - a.priority || a.order - b.order,
						);
					const col = document.createElement('div');
					col.className = 'col';
					col.dataset.state = state;
					col.innerHTML = `<h2><span>${esc(state)}</span><span>${cards.length}</span></h2><div class="cards"></div>`;
					const list = col.querySelector('.cards');
					for (const c of cards) list.appendChild(cardEl(c));

					col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('over'); });
					col.addEventListener('dragleave', () => col.classList.remove('over'));
					col.addEventListener('drop', async (e) => {
						e.preventDefault();
						col.classList.remove('over');
						if (!dragId) return;
						await api(`/api/cards/${encodeURIComponent(dragId)}/move`, 'POST', { state });
						dragId = null;
						await refresh();
					});
					board.appendChild(col);
				}
				// Never redraw over work in progress: the old focus/blur guard dropped edits the
				// moment you clicked away, and the dirty check alone still ate anything typed
				// into the verdict box, which Save does not own.
				if (selectedId && !isDirty() && !hasPendingInput() && !saving) renderPanel();
			}

			function cardEl(c) {
				const el = document.createElement('div');
				// `mine` is the loudest thing a card can be: the board has stopped watching it
				// and only you can move it on. A left border reads at a glance across columns.
				el.className = 'card' + (c.id === selectedId ? ' sel' : '') + (c.manualSince ? ' mine' : '');
				el.draggable = true;
				const eligible = (snapshot.eligible || []).includes(c.id);
				el.innerHTML =
					`<div class="t">${esc(c.title)}</div>
					<div class="meta">
						<span class="tag p">P${c.priority}</span>
						${c.state === 'Review' || c.state === 'Blocked' ? `<span class="tag" style="color:var(--warn)" title="Entered ${esc(c.state)} on ${new Date(c.stateChangedAt).toLocaleString()}">waiting ${rel(c.stateChangedAt).replace(' ago', '')}</span>` : ''}
						${c.dependencies.length ? `<span class="tag">deps ${c.dependencies.length}</span>` : ''}
						${c.attemptCount ? `<span class="tag">try ${c.attemptCount}/${c.maxAttempts}</span>` : ''}
						${eligible ? '<span class="tag" style="color:var(--ok)">eligible</span>' : ''}
						${c.manualSince ? `<span class="tag mine" title="You took this session on ${new Date(c.manualSince).toLocaleString()} — the board is not watching it">yours ${rel(c.manualSince).replace(' ago', '')}</span>` : ''}
						${!eligible && c.heldBecause ? `<span class="tag" style="color:var(--warn)">${esc(c.heldBecause)}</span>` : ''}
						${c.repeatEveryMs ? '<span class="tag">repeats</span>' : ''}
						${c.lastResult ? `<span class="tag ${c.lastResult === 'DONE' ? '' : 'err'}">${esc(c.lastResult)}</span>` : ''}
					</div>`;
				el.addEventListener('dragstart', () => { dragId = c.id; });
				el.addEventListener('click', () => {
				if (isDirty() && !confirm('Discard the unsaved changes on this card?')) return;
				selectedId = c.id;
				baseline = null;
				lastSaveMsg = null;
				renderPanel();
			});
				return el;
			}

			/**
			 * Which sections the user has opened, kept across re-renders so a poll never
			 * folds a section shut while it is being read.
			 */
			const openGroups = {};

			/** The values the panel was rendered with, to compare against for unsaved edits. */
			let baseline = null;

			/**
			 * The markup the body was last built from, and the card it described.
			 *
			 * This cannot be read back off the DOM. The browser rewrites what it parses —
			 * `open` becomes `open=""`, `<input />` loses the slash, `<option selected>` gains
			 * `=""` — so comparing a template string against `innerHTML` NEVER matched, and
			 * the body was in fact torn down and rebuilt on every 1.5s poll. Scroll position
			 * survived only because it is explicitly saved and restored below, which hid the
			 * dead comparison. Anything not restored by hand — text typed into the verdict
			 * box, the caret, focus — was destroyed twice a second.
			 */
			let lastBody = null;
			let lastBodyCard = null;

			/** The editable fields, in one list, so save/revert/dirty all agree on the set. */
			const FIELDS = [
				['f-title', 'title'],
				['f-desc', 'description'],
				['f-ac', 'acceptanceCriteria'],
				['f-prio', 'priority'],
				['f-order', 'order'],
				['f-max', 'maxAttempts'],
				['f-repo', 'repo'],
				['f-agent', 'agent'],
				['f-deps', 'dependencies'],
				['f-hold', 'hold'],
				['f-every', 'every'],
			];

			/** What the form currently holds, as plain strings for a cheap comparison. */
			function formValues() {
				const out = {};
				for (const [id] of FIELDS) out[id] = document.getElementById(id)?.value ?? '';
				return out;
			}

			const isDirty = () => {
				if (!baseline) return false;
				const now = formValues();
				return FIELDS.some(([id]) => now[id] !== baseline[id]);
			};

			/**
			 * Work in the panel that no button owns yet.
			 *
			 * The verdict box is deliberately NOT in FIELDS — Save does not persist it, so
			 * marking the form dirty from it would promise something Save will not do. That
			 * left it outside the only thing guarding against a redraw, so every poll ate
			 * what was being typed. Focus counts too: a cursor sitting in the panel is a
			 * person mid-thought, and moving the ground under them is its own bug.
			 */
			function hasPendingInput() {
				const note = document.getElementById('f-comment');
				if (note && note.value !== '') return true;
				const here = document.activeElement;
				return Boolean(here && here !== document.body && document.getElementById('panelBody')?.contains(here));
			}

			/**
			 * The footer is the only place that talks about saving, and it always describes
			 * the current state: nothing to save, unsaved edits, in flight, or the result.
			 * `message` survives a re-render so a "Saved" confirmation is actually readable.
			 */
			function renderFooter(message = null, tone = '') {
				const dirty = isDirty();
				const btn = document.getElementById('saveBtn');
				const revert = document.getElementById('revertBtn');
				const msg = document.getElementById('saveMsg');
				btn.disabled = !dirty || saving;
				btn.textContent = saving ? 'Saving…' : 'Save changes';
				revert.disabled = !dirty || saving;
				revert.title = dirty ? '' : 'Nothing has been changed';
				msg.className = `msg ${tone}`;
				msg.textContent = message ?? (dirty ? 'Unsaved changes' : '');
			}

			let saving = false;
			let lastSaveMsg = null;

			async function renderPanel() {
				const c = snapshot.cards.find((x) => x.id === selectedId);
				if (!c) return closePanel();
				const inFlightIds = ((snapshot.scheduler || {}).inFlight || []).map((f) => f.cardId);
				document.getElementById('panel').classList.remove('hidden');
				let runs = [];
				let comments = [];

				// One place that decides what this card allows, mirroring the board's own
				// rules so the UI never offers something the API will refuse.
				//
				// `running` comes from the card's STATE, not this scheduler's lanes: a card
				// executed by another daemon is In Progress here too, and the board refuses
				// to touch it either way. Stopping, though, only works for our own lanes.
				const running = c.state === 'In Progress';
				const stoppable = inFlightIds.includes(c.id);
				const reviewable = c.state === 'Review' || c.state === 'Blocked';
				const mine = Boolean(c.manualSince);
				const can = {
					retry: !running && (c.state === 'Blocked' || c.attemptCount > 0),
					destroy: !running,
					verdict: reviewable,
					openChanges: Boolean(c.worktreePath),
					openSession: running && Boolean(c.sessionId),
					// The transcript lives on disk keyed by the worktree, so a closed terminal is
					// not a dead end: a worktree plus a resume-capable agent is all it takes.
					resume: Boolean(c.worktreePath) && Boolean(resumeCommandFor(c)),
					// Taking over needs a live session to take; taking back needs the worktree
					// the watch will re-attach to.
					takeOver: running && !mine && Boolean(c.sessionId),
					takeBack: mine && Boolean(c.worktreePath),
				};
				const why = {
					retry: running ? 'Stop the card first' : 'Nothing has been attempted yet',
					destroy: 'Stop the card before deleting it',
					verdict: `Only a card in Review or Blocked has a result to judge — this one is in ${c.state}`,
					openChanges: 'This card has never run, so there are no changes',
					openSession: c.sessionId ? 'The session is closed — use Resume conversation' : 'This card has no session',
					resume: !c.worktreePath
						? 'This card has never run, so there is no conversation'
						: `${esc(c.agent || snapshot.config.defaultAgent)} has no resume command configured`,
					takeOver: mine
						? 'You already have this card'
						: !running
							? `Only a running card has a live session to take — this one is in ${c.state}`
							: 'This card has no live session',
					takeBack: 'The board is already watching this card',
				};
				try { runs = (await api(`/api/cards/${encodeURIComponent(c.id)}/runs`)).runs; } catch {}
				try { comments = (await api(`/api/cards/${encodeURIComponent(c.id)}/comments`)).comments; } catch {}

				// Open what this card's state is actually about, unless the user chose.
				const open = (name, fallback) => (openGroups[name] ?? fallback) ? 'open' : '';
				const held = c.notBefore && c.notBefore > Date.now();

				const nextHead = `
					<h2>${esc(c.title)}</h2>
					<div class="meta">
						<span class="tag" title="Entered ${esc(c.state)} on ${new Date(c.stateChangedAt).toLocaleString()}">${esc(c.state)} · ${rel(c.stateChangedAt)}</span>
						<span class="tag p">P${c.priority}</span>
						${c.attemptCount ? `<span class="tag">try ${c.attemptCount}/${c.maxAttempts}</span>` : ''}
						${!eligibleNow(c) && c.heldBecause ? `<span class="tag" style="color:var(--warn)">${esc(c.heldBecause)}</span>` : ''}
						<span class="tag">${esc(c.id)}</span>
					</div>`;

				const nextBody = `
					<details class="group" data-g="work" ${open('work', true)}>
						<summary>The work</summary>
						<div class="group-body">
							<label for="f-title">Title</label>
							<input id="f-title" value="${esc(c.title)}" />
							<label for="f-desc">Description</label>
							<textarea id="f-desc">${esc(c.description)}</textarea>
							<label for="f-ac">Acceptance criteria</label>
							<textarea id="f-ac">${esc(c.acceptanceCriteria)}</textarea>
						</div>
					</details>

					<details class="group" data-g="run" ${open('run', false)}>
						<summary>How it runs<span class="n">${esc(c.agent || snapshot.config.defaultAgent)}${c.dependencies.length ? ` · ${c.dependencies.length} dep${c.dependencies.length > 1 ? 's' : ''}` : ''}</span></summary>
						<div class="group-body">
							<div class="grid">
								<div><label for="f-prio">Priority</label><input id="f-prio" type="number" value="${c.priority}" /></div>
								<div><label for="f-order">Order</label><input id="f-order" type="number" value="${c.order}" /></div>
								<div><label for="f-max">Max tries</label><input id="f-max" type="number" min="1" value="${c.maxAttempts}" /></div>
							</div>
							<label for="f-repo">Repo — path or <kbd>id:…</kbd></label>
							<input id="f-repo" value="${esc(c.repo ?? '')}" placeholder="${esc(snapshot.config.defaultRepo || 'default repo')}" />
							<label for="f-agent">Agent</label>
							<select id="f-agent">
								<option value="">default (${esc(snapshot.config.defaultAgent)})</option>
								${(snapshot.config.agents || []).map((a) => `<option ${c.agent === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}
							</select>
							<label for="f-deps">Waits for — card ids, comma separated</label>
							<input id="f-deps" value="${esc(c.dependencies.join(','))}" placeholder="card_a, card_b" />
							<div class="grid">
								<div>
									<label for="f-hold">Hold until</label>
									<input id="f-hold" value="${held ? esc(new Date(c.notBefore).toISOString().slice(0, 10)) : ''}" placeholder="7d, 12h, 2026-08-19" />
								</div>
								<div>
									<label for="f-every">Repeat every</label>
									<input id="f-every" value="${c.repeatEveryMs ? esc(humanDuration(c.repeatEveryMs)) : ''}" placeholder="1w, 3d, 12h" />
								</div>
							</div>
							${held ? `<div class="hint">Held until ${new Date(c.notBefore).toLocaleString()} — ${rel(c.notBefore)}. Clear the field and save to release it.</div>` : ''}
							<div class="actions">
								<button ${can.retry ? '' : `disabled title="${esc(why.retry)}"`} onclick="retryCard()">Retry now</button>
								${stoppable ? '<button class="danger" onclick="stopThisCard()">Stop this card</button>' : ''}
								<button class="danger" ${can.destroy ? '' : `disabled title="${esc(why.destroy)}"`} onclick="deleteCard()">Delete</button>
							</div>
							${running && !stoppable ? '<div class="hint">Running under another scheduler, so it cannot be stopped from here.</div>' : ''}
						</div>
					</details>

					${
						mine
							? `<details class="group mine" data-g="mine" open>
						<summary>You have this card<span class="n">for ${esc(rel(c.manualSince).replace(" ago", ""))}</span></summary>
						<div class="group-body">
							<div class="hint">The board is not watching this session. It will not judge the card, move it,
							or close the terminal — and its slot stays held, because the lane is yours. Steer the agent,
							edit by hand, do both. Take back when you want the board watching again.</div>
							<div class="actions">
								<button class="primary" ${can.takeBack ? '' : `disabled title="${esc(why.takeBack)}"`} onclick="takeBack()">Take back</button>
								<button ${can.openSession ? '' : `disabled title="${esc(why.openSession)}"`} onclick="openInOrca('session')">Open session</button>
								${stoppable ? '<button class="danger" onclick="stopThisCard()">Stop this card</button>' : ''}
							</div>
						</div>
					</details>`
							: running
								? `<details class="group" data-g="mine" ${open('mine', false)}>
						<summary>Take over<span class="n">the board is watching</span></summary>
						<div class="group-body">
							<div class="hint">Interrupts the agent mid-turn and hands you the session. Pressing Esc in the
							terminal does exactly the same thing. Nothing settles this card until you take it back.</div>
							<div class="actions">
								<button ${can.takeOver ? '' : `disabled title="${esc(why.takeOver)}"`} onclick="takeOver()">Take over</button>
								<button ${can.openSession ? '' : `disabled title="${esc(why.openSession)}"`} onclick="openInOrca('session')">Open session</button>
							</div>
						</div>
					</details>`
								: ''
					}

					<details class="group" data-g="review" ${open('review', reviewable)}>
						<summary>Review<span class="n">${reviewable ? 'your call' : esc(c.lastResult || 'not run')}</span></summary>
						<div class="group-body">
							${c.lastAgentSummary ? `<label>What the agent said</label><div class="prose" data-scroll="summary">${prose(c.lastAgentSummary)}</div>` : ''}
							${c.lastError ? `<label>Last error</label><div class="prose bad" data-scroll="error">${prose(c.lastError)}</div>` : ''}
							<div class="actions" style="margin-top:0">
								<button ${can.openChanges ? '' : `disabled title="${esc(why.openChanges)}"`} onclick="openInOrca('changes')">Open in Orca</button>
								<button ${can.openSession ? '' : `disabled title="${esc(why.openSession)}"`} onclick="openInOrca('session')">Open session</button>
								<button ${can.resume ? '' : `disabled title="${esc(why.resume)}"`} onclick="resumeSession()">Resume conversation</button>
								${can.openChanges ? `<button onclick="loadDiff()">${diffCache.cardId === c.id ? 'Reload' : 'Show'} diff</button>` : ''}
							</div>
							${diffCache.cardId === c.id ? `<pre data-scroll="diff" style="max-height:300px;color:var(--text)">${esc(diffCache.text)}</pre>` : ''}
							${c.commitSha ? `<div class="hint">Committed as <code>${esc(c.commitSha.slice(0, 8))}</code>.</div>` : can.openChanges ? '<div class="hint warn">Not committed — approving commits it on this card\u2019s branch.</div>' : ''}
							${can.verdict ? `
								<label for="f-comment">Your verdict</label>
								<textarea id="f-comment" placeholder="Required to request changes — the next agent reads it"></textarea>
								<div class="actions" style="margin-top:6px">
									<button class="ok" onclick="approveCard()">Approve → Done</button>
									<button class="danger" onclick="rejectCard()">Request changes → Ready</button>
									<button onclick="addComment()">Note only</button>
								</div>` : `
								<div class="hint">${esc(why.verdict)}.</div>
								<div class="actions" style="margin-top:6px">
									<label for="f-comment" style="margin:0">Add a note</label>
								</div>
								<textarea id="f-comment" placeholder="Anything worth recording on this card"></textarea>
								<div class="actions" style="margin-top:6px"><button onclick="addComment()">Add note</button></div>`}
							<details class="group" data-g="trail" ${open('trail', false)} style="border:0">
								<summary>Review trail<span class="n">${comments.length}</span></summary>
								<div class="trail">${
									comments.map((m) => `<div><span class="k ${esc(m.kind)}">${esc(m.kind === 'comment' ? 'note' : m.kind)}</span> · ${esc(m.author)} · ${new Date(m.createdAt).toLocaleString()}<br>${esc(m.body)}</div>`).join('') || '<div class="hint">Nothing recorded yet.</div>'
								}</div>
							</details>
						</div>
					</details>

					<details class="group" data-g="tech" ${open('tech', false)}>
						<summary>Runs and technical<span class="n">${runs.length} run${runs.length === 1 ? '' : 's'}</span></summary>
						<div class="group-body">
							<div class="runs">${
								runs.map((r) => `<div><b>${esc(r.status)}</b> · ${new Date(r.startedAt).toLocaleString()}${r.commitSha ? ' · ' + esc(r.commitSha.slice(0, 8)) : ''}${r.error ? `<br><span style="color:var(--bad)">${esc(r.error)}</span>` : ''}</div>`).join('') || '<div class="hint">Never run.</div>'
							}</div>
							${c.worktreePath ? `<label>Worktree</label><pre>${esc(c.worktreePath)}${c.branch ? `\n${esc(c.branch)}` : ''}${c.worktreeId ? `\n${esc(c.worktreeId)}` : ''}</pre>` : ''}
							${c.sessionId ? `<label>Orca session</label><pre>${esc(c.sessionId)}</pre>` : ''}
							${c.commitSha ? `<label>Commit</label><pre>${esc(c.commitSha)}</pre>` : ''}
						</div>
					</details>`;

				const headEl = document.getElementById('panelHead');
				const bodyEl = document.getElementById('panelBody');
				// The head holds no inputs and carries a ticking age, so it is rewritten every
				// poll on purpose. It had the same comparison as the body, which was equally
				// dead — keeping it would only suggest a saving that never happened.
				headEl.innerHTML = nextHead;

				// Only touch the body when the markup genuinely changed, compared against what
				// we last built rather than against the DOM's own rewriting of it.
				if (lastBody !== nextBody || lastBodyCard !== c.id) {
					// A redraw that IS needed must not lose the reader's place, and must not
					// swallow half-written text. Both are only worth carrying over when the
					// panel still describes the same card — a note belongs to the card it was
					// typed on, never to the next one clicked.
					const same = lastBodyCard === c.id;
					const scrolls = [...bodyEl.querySelectorAll('[data-scroll]')].map((e) => [e.dataset.scroll, e.scrollTop]);
					const note = same ? bodyEl.querySelector('#f-comment') : null;
					const typed = note && note.value !== ''
						? { value: note.value, start: note.selectionStart, end: note.selectionEnd, focused: document.activeElement === note }
						: null;

					bodyEl.innerHTML = nextBody;
					lastBody = nextBody;
					lastBodyCard = c.id;

					for (const [key, top] of scrolls) {
						const el = bodyEl.querySelector(`[data-scroll="${key}"]`);
						if (el) el.scrollTop = top;
					}

					if (typed) {
						const next = bodyEl.querySelector('#f-comment');
						if (next) {
							next.value = typed.value;
							if (typed.focused) {
								next.focus();
								next.setSelectionRange(typed.start, typed.end);
							}
						}
					}

					// Remember only what the USER opened. Chrome queues a `toggle` event for a
					// details that is inserted already open, so listening to `toggle` made the
					// auto-opened Review section leak onto every card clicked afterwards.
					for (const d of bodyEl.querySelectorAll('details.group')) {
						d.querySelector('summary').addEventListener('click', () => { openGroups[d.dataset.g] = !d.open; });
					}
					// Every edit re-evaluates the footer, so "Unsaved changes" appears as you type.
					for (const el of bodyEl.querySelectorAll('input, textarea, select')) {
						el.addEventListener('input', () => renderFooter());
						el.addEventListener('change', () => renderFooter());
					}
					baseline = formValues();
				}

				// Reselecting the same card produces identical markup, so the block above may
				// not run. Without this the form would have no baseline and Save would never
				// light up.
				if (!baseline) baseline = formValues();

				renderFooter(lastSaveMsg?.text, lastSaveMsg?.tone);
			}

			const eligibleNow = (c) => (snapshot.eligible || []).includes(c.id);

			/** Whether this card’s agent can reopen its conversation. */
			const resumeCommandFor = (c) =>
				(snapshot.config.resumableAgents || []).includes(c.agent || snapshot.config.defaultAgent);

			/** Milliseconds back into the shortest thing a person would have typed. */
			function humanDuration(ms) {
				for (const [unit, size] of [['w', 604800000], ['d', 86400000], ['h', 3600000], ['m', 60000]]) {
					if (ms % size === 0) return `${ms / size}${unit}`;
				}
				return `${Math.round(ms / 3600000)}h`;
			}

			function closePanel() {
				if (isDirty() && !confirm('Discard the unsaved changes on this card?')) return;
				selectedId = null;
				baseline = null;
				lastBody = null;
				lastSaveMsg = null;
				document.getElementById('panel').classList.add('hidden');
			}

			const val = (id) => document.getElementById(id).value;

			/** Puts a result in the footer and lets it fade on the next real interaction. */
			function reportSave(text, tone) {
				lastSaveMsg = { text, tone };
				renderFooter(text, tone);
				if (tone === 'ok') setTimeout(() => { if (lastSaveMsg?.text === text) { lastSaveMsg = null; renderFooter(); } }, 4000);
			}

			/**
			 * One save for the whole card, including the schedule. Two endpoints are still
			 * involved because a hold is expressed as a duration the server parses, but the
			 * user sees a single button and a single outcome.
			 */
			async function saveCard() {
				if (!isDirty() || saving) return;
				const hold = val('f-hold').trim();
				const every = val('f-every').trim();
				const everyMs = every ? durationMs(every) : null;
				if (every && everyMs === null) return reportSave('Could not read the repeat interval — try 1w, 3d or 12h.', 'bad');

				saving = true;
				renderFooter('Saving…');
				try {
					const patch = {
						title: val('f-title'),
						description: val('f-desc'),
						acceptanceCriteria: val('f-ac'),
						priority: Number(val('f-prio')),
						order: Number(val('f-order')),
						maxAttempts: Number(val('f-max')),
						repo: val('f-repo') || null,
						agent: val('f-agent') || null,
						dependencies: val('f-deps').split(',').map((s) => s.trim()).filter(Boolean),
						repeatEveryMs: everyMs,
					};
					// An emptied hold field means release it; the snooze route owns setting one
					// because it is what understands "7d".
					if (hold === '') patch.notBefore = null;
					await api(`/api/cards/${encodeURIComponent(selectedId)}`, 'PATCH', patch);
					if (hold !== '' && hold !== baseline['f-hold']) {
						await api(`/api/cards/${encodeURIComponent(selectedId)}/snooze`, 'POST', { until: hold });
					}
				} catch (e) {
					saving = false;
					return reportSave(e.message, 'bad');
				}
				saving = false;
				// Drop the baseline first: the poll refuses to redraw while the form looks
				// dirty, so without this the panel keeps saying "Unsaved changes" and the
				// header keeps showing the values you just replaced.
				baseline = null;
				lastSaveMsg = { text: 'Saved', tone: 'ok' };
				await refresh();
				reportSave('Saved', 'ok');
			}

			/** Throws the edits away and shows the card as the board has it. */
			function revertCard() {
				if (!isDirty()) return;
				lastSaveMsg = null;
				baseline = null;
				// Typing changes an input's value PROPERTY, not its attribute, so the rebuilt
				// markup is identical to what is already on screen and the guard would skip it.
				// Forgetting the last markup is what forces the rewrite that discards the edits.
				lastBody = null;
				renderPanel();
			}

			/**
			 * Reopens the agent conversation for this card in a fresh Orca terminal. The
			 * transcript is stored per worktree, so a closed tab lost nothing.
			 */
			async function resumeSession() {
				renderFooter("Reopening…");
				let out;
				try {
					out = await api(`/api/cards/${encodeURIComponent(selectedId)}/resume`, "POST", {});
				} catch (e) {
					return reportSave(e.message, "bad");
				}
				baseline = null;
				await refresh();
				reportSave(`Reopened with ${out.command}`, "ok");
			}

			async function takeOver() {
				renderFooter('Taking over\u2026');
				try {
					await api(`/api/cards/${encodeURIComponent(selectedId)}/takeover`, 'POST', {});
				} catch (e) {
					return reportSave(e.message, 'bad');
				}
				baseline = null;
				await refresh();
				reportSave('Yours \u2014 the board has stopped watching', 'ok');
			}

			async function takeBack() {
				renderFooter('Handing back\u2026');
				try {
					await api(`/api/cards/${encodeURIComponent(selectedId)}/takeback`, 'POST', {});
				} catch (e) {
					return reportSave(e.message, 'bad');
				}
				baseline = null;
				await refresh();
				reportSave('The board is watching this session again', 'ok');
			}

			async function retryCard() {
				await api(`/api/cards/${encodeURIComponent(selectedId)}/retry`, 'POST', {});
				await refresh();
			}

			async function stopThisCard() {
				if (!confirm('Interrupt this card\u2019s agent now?')) return;
				await api('/api/scheduler/stop-current', 'POST', { cardId: selectedId });
				await refresh();
			}

			/** Mirrors parseDuration in src/text.ts; the server validates again anyway. */
			function durationMs(value) {
				const units = { s: 1000, m: 60000, h: 3600000, d: 86400000, w: 604800000 };
				const text = value.trim().toLowerCase();
				if (/^\d+$/.test(text)) return Number(text) * units.m;
				const parts = text.match(/\d+[smhdw]/g);
				if (!parts || parts.join('') !== text) return null;
				return parts.reduce((sum, p) => sum + Number(p.slice(0, -1)) * units[p.slice(-1)], 0) || null;
			}

			const commentText = () => (document.getElementById('f-comment')?.value ?? '').trim();

			/**
			 * Every verdict reports through the footer, the same place a save does, so there
			 * is one spot to look for "did that work" instead of a mix of alerts and silence.
			 */
			async function postVerdict(action, body, done) {
				renderFooter('Working…');
				try {
					await api(`/api/cards/${encodeURIComponent(selectedId)}/${action}`, 'POST', body);
				} catch (e) {
					return reportSave(e.message, 'bad');
				}
				// The note has been filed, so the box must be emptied here. Nothing else does
				// it: the redraw now carries unsent text ACROSS a rebuild, so leaving the value
				// in place would restore what was just sent and keep the panel from refreshing.
				const note = document.getElementById('f-comment');
				if (note) note.value = '';
				// The verdict moved the card, so the panel must redraw from the board.
				baseline = null;
				lastBody = null;
				lastSaveMsg = { text: done, tone: 'ok' };
				await refresh();
				reportSave(done, 'ok');
			}

			async function approveCard() {
				const body = commentText();
				await postVerdict('approve', body ? { comment: body } : {}, 'Approved and committed');
			}

			async function rejectCard() {
				const body = commentText();
				if (!body) return reportSave('Say what needs to change — the next agent reads this.', 'bad');
				await postVerdict('reject', { comment: body }, 'Sent back to Ready');
			}

			async function addComment() {
				const body = commentText();
				if (!body) return reportSave('Write the note first.', 'bad');
				await postVerdict('comments', { body }, 'Note added');
			}

			async function loadDiff() {
				const id = selectedId;
				try {
					const { diff, reason } = await api(`/api/cards/${encodeURIComponent(id)}/diff`);
					if (!diff) {
						diffCache = { cardId: id, text: reason || 'no diff available' };
					} else {
						const header = `vs ${diff.baseRef || 'HEAD'}${diff.untracked.length ? ` · ${diff.untracked.length} new file(s)` : ''}\n\n`;
						diffCache = { cardId: id, text: header + (diff.stat ? diff.stat + '\n\n' : '') + (diff.patch || 'no changes') };
					}
				} catch (e) {
					diffCache = { cardId: id, text: `could not read the diff: ${e.message}` };
				}
				renderPanel();
			}

			async function openInOrca(target) {
				try {
					await api(`/api/cards/${encodeURIComponent(selectedId)}/open`, 'POST', { target });
				} catch (e) {
					alert(e.message);
				}
			}

			async function deleteCard() {
				if (!confirm('Delete this card?')) return;
				await api(`/api/cards/${encodeURIComponent(selectedId)}`, 'DELETE');
				closePanel();
				await refresh();
			}

			document.getElementById('new').onclick = async () => {
				const title = prompt('Card title');
				if (!title) return;
				const { card } = await api('/api/cards', 'POST', { title, state: 'Backlog' });
				selectedId = card.id;
				await refresh();
			};

			const ctl = (id, url, body) => {
				document.getElementById(id).onclick = async () => {
					try { await api(url, 'POST', body ?? {}); } catch (e) { alert(e.message); }
					await refresh();
				};
			};
			// One button, two endpoints: whichever the current state makes meaningful.
			document.getElementById('autorun').onclick = async () => {
				const on = (snapshot.scheduler || {}).autoRun;
				try {
					await api(on ? '/api/scheduler/pause' : '/api/scheduler/start', 'POST', {});
				} catch (e) {
					alert(e.message);
				}
				await refresh();
			};
			ctl('after', '/api/scheduler/stop-after-current');
			ctl('stopcur', '/api/scheduler/stop-current');
			ctl('once', '/api/scheduler/run-once');
			ctl('recover', '/api/scheduler/recover');

			async function refresh() {
				try {
					snapshot = await api('/api/state');
					render();
				} catch (e) {
					document.getElementById('sstate').innerHTML = `<span class="dot" style="background:var(--bad)"></span>${esc(e.message)}`;
				}
			}

			// Two habits people already have: Esc closes, and the browser warns before a
			// reload throws work away.
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape' && selectedId) closePanel();
			});
			window.addEventListener('beforeunload', (e) => {
				if (isDirty()) e.preventDefault();
			});

			refresh();
			setInterval(refresh, 1500);
		</script>
	</body>
</html>
